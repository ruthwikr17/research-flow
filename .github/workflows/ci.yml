name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        # All tests are fully mocked — no real Groq/Gemini/Tavily/Exa API calls.
        # Provide dummy env vars so Settings validation passes without real keys.
        env:
          GROQ_API_KEY: "ci-dummy-groq-key"
          GEMINI_PROJECT_KEYS: "ci-dummy-gemini-key"
          TAVILY_API_KEY: "ci-dummy-tavily-key"
          EXA_API_KEY: "ci-dummy-exa-key"
        run: pytest backend/tests/ -v --tb=short
